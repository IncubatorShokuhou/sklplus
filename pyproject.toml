[project]
name = "sklplus"
version = "0.1.0"
description = "Big sklearn: re-exports and light wrappers for tabular ML pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.3",
  "numpy",
  "pandas",
  "scipy",
  "joblib",
  "xgboost",
  "lightgbm",
  "catboost",
  "imbalanced-learn",
  "pyod",
  "kmodes",
  "category-encoders",
  "feature-engine",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sklplus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
